<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, system-ui, sans-serif">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGlowL" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#9f6bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowR" cx="80%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#4ff1ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4ff1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0b12"/>
      <stop offset="100%" stop-color="#07070b"/>
    </linearGradient>

    <!-- Accent gradients -->
    <linearGradient id="gradAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9f6bff"/>
      <stop offset="100%" stop-color="#4ff1ff"/>
    </linearGradient>
    <linearGradient id="gradPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6bd6"/>
      <stop offset="100%" stop-color="#9f6bff"/>
    </linearGradient>
    <linearGradient id="gradLime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a6ff5f"/>
      <stop offset="100%" stop-color="#4ff1ff"/>
    </linearGradient>
    <linearGradient id="gradWarn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc53d"/>
      <stop offset="100%" stop-color="#ff6bd6"/>
    </linearGradient>

    <!-- Card filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dy="6" in="blur" result="off"/>
      <feComponentTransfer in="off" result="shadow">
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ff1ff"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9f6bff"/>
    </marker>
    <marker id="arrPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6bd6"/>
    </marker>
    <marker id="arrLime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a6ff5f"/>
    </marker>
    <marker id="arrWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffc53d"/>
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1600" height="1000" fill="url(#bgBase)"/>
  <rect width="1600" height="1000" fill="url(#bgGlowL)"/>
  <rect width="1600" height="1000" fill="url(#bgGlowR)"/>

  <!-- subtle grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 250 H1600 M0 500 H1600 M0 750 H1600"/>
    <path d="M400 0 V1000 M800 0 V1000 M1200 0 V1000"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(80,60)">
    <text x="0" y="0" font-family="Space Grotesk, Inter, sans-serif" font-size="56" font-weight="700" fill="#f4f4fb" letter-spacing="-1.5">
      web3community
    </text>
    <text x="0" y="38" font-size="22" fill="#b8b8cf" letter-spacing="0.5">
      Dual-token DAO ecosystem · Pay → Burn → Mint → Reward
    </text>
  </g>
  <g transform="translate(1520,90)" text-anchor="end">
    <rect x="-220" y="-32" width="220" height="44" rx="22" fill="#12121c" stroke="#23233a"/>
    <circle cx="-195" cy="-10" r="5" fill="#3ddc97"/>
    <text x="-180" y="-6" font-size="14" fill="#b8b8cf" font-family="JetBrains Mono, monospace">
      α = 0.95 · cap 5M · 7-day rounds
    </text>
  </g>

  <!-- TWO TOKENS PANEL -->
  <g transform="translate(80,160)">
    <!-- GOV card -->
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="280" height="120" rx="16" fill="#12121c" stroke="url(#gradAccent)" stroke-width="1.5"/>
      <circle cx="40" cy="40" r="22" fill="url(#gradAccent)"/>
      <text x="40" y="47" font-size="20" font-weight="700" fill="#07070b" text-anchor="middle">G</text>
      <text x="78" y="36" font-size="22" font-weight="700" fill="#f4f4fb">GOV</text>
      <text x="78" y="58" font-size="13" fill="#b8b8cf">Governance · cap 100M</text>
      <text x="20" y="92" font-size="13" fill="#7c7c98">Vote · stake · collateral</text>
    </g>
    <!-- CREDIT card -->
    <g transform="translate(310,0)" filter="url(#softShadow)">
      <rect x="0" y="0" width="280" height="120" rx="16" fill="#12121c" stroke="url(#gradPink)" stroke-width="1.5"/>
      <circle cx="40" cy="40" r="22" fill="url(#gradPink)"/>
      <text x="40" y="47" font-size="20" font-weight="700" fill="#07070b" text-anchor="middle">C</text>
      <text x="78" y="36" font-size="22" font-weight="700" fill="#f4f4fb">CREDIT</text>
      <text x="78" y="58" font-size="13" fill="#b8b8cf">Utility · elastic supply</text>
      <text x="20" y="92" font-size="13" fill="#7c7c98">Pay · burn · reward</text>
    </g>
  </g>

  <!-- ACTORS LEGEND (right side header) -->
  <g transform="translate(720,160)">
    <text x="0" y="20" font-size="14" font-weight="600" fill="#7c7c98" letter-spacing="2">ACTORS</text>
    <g transform="translate(0,32)">
      <g><circle cx="14" cy="14" r="14" fill="#ff6bd6"/><text x="14" y="19" font-size="13" font-weight="700" fill="#07070b" text-anchor="middle">CH</text>
        <text x="36" y="19" font-size="14" fill="#f4f4fb">Charlie · user</text></g>
      <g transform="translate(0,40)"><circle cx="14" cy="14" r="14" fill="#9f6bff"/><text x="14" y="19" font-size="13" font-weight="700" fill="#07070b" text-anchor="middle">AL</text>
        <text x="36" y="19" font-size="14" fill="#f4f4fb">Alice · staker</text></g>
    </g>
    <g transform="translate(220,32)">
      <g><circle cx="14" cy="14" r="14" fill="#a6ff5f"/><text x="14" y="19" font-size="13" font-weight="700" fill="#07070b" text-anchor="middle">BO</text>
        <text x="36" y="19" font-size="14" fill="#f4f4fb">Bob · LP</text></g>
      <g transform="translate(0,40)"><circle cx="14" cy="14" r="14" fill="#4ff1ff"/><text x="14" y="19" font-size="13" font-weight="700" fill="#07070b" text-anchor="middle">AP</text>
        <text x="36" y="19" font-size="14" fill="#f4f4fb">App · dApp team</text></g>
    </g>
    <g transform="translate(420,32)">
      <g><circle cx="14" cy="14" r="14" fill="#ffc53d"/><text x="14" y="19" font-size="13" font-weight="700" fill="#07070b" text-anchor="middle">DA</text>
        <text x="36" y="19" font-size="14" fill="#f4f4fb">DAO · governance</text></g>
      <g transform="translate(0,40)"><rect x="0" y="0" width="28" height="28" rx="8" fill="#23233a" stroke="#4ff1ff"/>
        <text x="14" y="19" font-size="13" font-weight="700" fill="#4ff1ff" text-anchor="middle">⚙</text>
        <text x="36" y="19" font-size="14" fill="#f4f4fb">Treasury · POL</text></g>
    </g>
  </g>

  <!-- =================== MAIN FLOW =================== -->
  <!-- Step 1: Buy CREDIT -->
  <g transform="translate(80,360)" filter="url(#softShadow)">
    <rect x="0" y="0" width="220" height="170" rx="18" fill="#12121c" stroke="#23233a"/>
    <circle cx="32" cy="32" r="18" fill="url(#gradAccent)"/>
    <text x="32" y="38" font-size="16" font-weight="700" fill="#07070b" text-anchor="middle">1</text>
    <text x="20" y="80" font-size="18" font-weight="700" fill="#f4f4fb">Buy CREDIT</text>
    <text x="20" y="103" font-size="13" fill="#b8b8cf">Charlie swaps USDC →</text>
    <text x="20" y="120" font-size="13" fill="#b8b8cf">CREDIT on Uniswap V3</text>
    <text x="20" y="145" font-size="11" fill="#7c7c98" font-family="JetBrains Mono, monospace">CREDIT/USDC · 0.3%</text>
  </g>

  <!-- Step 2: Pay App -->
  <g transform="translate(370,360)" filter="url(#softShadow)">
    <rect x="0" y="0" width="220" height="170" rx="18" fill="#12121c" stroke="#23233a"/>
    <circle cx="32" cy="32" r="18" fill="url(#gradAccent)"/>
    <text x="32" y="38" font-size="16" font-weight="700" fill="#07070b" text-anchor="middle">2</text>
    <text x="20" y="80" font-size="18" font-weight="700" fill="#f4f4fb">Pay the App</text>
    <text x="20" y="103" font-size="13" fill="#b8b8cf">FeeRouter splits</text>
    <text x="20" y="120" font-size="13" fill="#b8b8cf">95% / 0% / 5%</text>
    <text x="20" y="145" font-size="11" fill="#7c7c98" font-family="JetBrains Mono, monospace">burn · treasury · rebate</text>
  </g>

  <!-- Step 3: Burn -->
  <g transform="translate(660,360)" filter="url(#softShadow)">
    <rect x="0" y="0" width="220" height="170" rx="18" fill="#12121c" stroke="url(#gradPink)" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="18" fill="url(#gradPink)"/>
    <text x="32" y="38" font-size="16" font-weight="700" fill="#07070b" text-anchor="middle">3</text>
    <text x="20" y="80" font-size="18" font-weight="700" fill="#f4f4fb">Burn 95%</text>
    <text x="20" y="103" font-size="13" fill="#b8b8cf">BurnTracker logs</text>
    <text x="20" y="120" font-size="13" fill="#b8b8cf">burn per project · round</text>
    <text x="20" y="145" font-size="11" fill="#ff6bd6" font-family="JetBrains Mono, monospace">supply ↓</text>
  </g>

  <!-- Step 4: Round closes + Emission -->
  <g transform="translate(950,360)" filter="url(#softShadow)">
    <rect x="0" y="0" width="280" height="170" rx="18" fill="#12121c" stroke="url(#gradAccent)" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="18" fill="url(#gradAccent)"/>
    <text x="32" y="38" font-size="16" font-weight="700" fill="#07070b" text-anchor="middle">4</text>
    <text x="60" y="38" font-size="18" font-weight="700" fill="#f4f4fb">Round R closes · finalize</text>
    <text x="20" y="78" font-size="12" fill="#7c7c98" font-family="JetBrains Mono, monospace">emission =</text>
    <text x="20" y="100" font-size="14" font-weight="700" fill="#4ff1ff" font-family="JetBrains Mono, monospace">min( max(α·burn, floor), capMax )</text>
    <text x="20" y="130" font-size="13" fill="#b8b8cf">α = 0.95 → deflationary by design</text>
    <text x="20" y="150" font-size="13" fill="#b8b8cf">cap = 5M · floor bootstraps 24 rounds</text>
  </g>

  <!-- Step 5: Split 4 buckets -->
  <g transform="translate(1280,360)" filter="url(#softShadow)">
    <rect x="0" y="0" width="240" height="170" rx="18" fill="#12121c" stroke="#23233a"/>
    <circle cx="32" cy="32" r="18" fill="url(#gradAccent)"/>
    <text x="32" y="38" font-size="16" font-weight="700" fill="#07070b" text-anchor="middle">5</text>
    <text x="60" y="38" font-size="18" font-weight="700" fill="#f4f4fb">Split 4 buckets</text>
    <!-- bar 100% -->
    <g transform="translate(20,70)">
      <rect x="0" y="0" width="200" height="22" rx="6" fill="#23233a"/>
      <rect x="0" y="0" width="110" height="22" rx="6" fill="#9f6bff"/>
      <rect x="110" y="0" width="50" height="22" fill="#4ff1ff"/>
      <rect x="160" y="0" width="30" height="22" fill="#a6ff5f"/>
      <rect x="190" y="0" width="10" height="22" rx="6" fill="#ffc53d"/>
    </g>
    <g transform="translate(20,108)" font-size="12" fill="#b8b8cf">
      <text x="0" y="0"><tspan fill="#9f6bff" font-weight="700">55%</tspan> Stakers</text>
      <text x="0" y="18"><tspan fill="#4ff1ff" font-weight="700">25%</tspan> LPs</text>
      <text x="110" y="0"><tspan fill="#a6ff5f" font-weight="700">15%</tspan> Apps</text>
      <text x="110" y="18"><tspan fill="#ffc53d" font-weight="700">5%</tspan> POL refill</text>
    </g>
  </g>

  <!-- Arrows step 1→2→3→4→5 -->
  <g fill="none" stroke="#4ff1ff" stroke-width="2.5">
    <line x1="300" y1="445" x2="365" y2="445" marker-end="url(#arrCyan)"/>
    <line x1="590" y1="445" x2="655" y2="445" marker-end="url(#arrCyan)"/>
    <line x1="880" y1="445" x2="945" y2="445" marker-end="url(#arrCyan)"/>
    <line x1="1230" y1="445" x2="1275" y2="445" marker-end="url(#arrCyan)"/>
  </g>

  <!-- Rebate arrow (Step 2 → App actor pill below) -->
  <g fill="none" stroke="#a6ff5f" stroke-width="2" stroke-dasharray="6 4">
    <path d="M480 530 V610" marker-end="url(#arrLime)"/>
  </g>
  <text x="490" y="570" font-size="12" fill="#a6ff5f" font-family="JetBrains Mono, monospace">5% rebate</text>

  <!-- =================== RECIPIENTS (Step 6) =================== -->
  <g transform="translate(80,610)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#7c7c98" letter-spacing="2">6 · WHO RECEIVES</text>
  </g>

  <!-- Stakers -->
  <g transform="translate(80,640)" filter="url(#softShadow)">
    <rect x="0" y="0" width="340" height="150" rx="18" fill="#12121c" stroke="#9f6bff" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="20" fill="#9f6bff"/>
    <text x="36" y="42" font-size="14" font-weight="700" fill="#07070b" text-anchor="middle">AL</text>
    <text x="70" y="34" font-size="18" font-weight="700" fill="#f4f4fb">Stakers · 55%</text>
    <text x="70" y="54" font-size="13" fill="#b8b8cf">Alice locks GOV in projectId</text>
    <text x="20" y="92" font-size="13" fill="#b8b8cf">Lazy <tspan font-family="JetBrains Mono, monospace" fill="#4ff1ff">claim()</tspan> · weight × project burn</text>
    <text x="20" y="115" font-size="12" fill="#7c7c98">Lock 14d–365d · multiplier 1×–4×</text>
    <text x="20" y="135" font-size="11" fill="#7c7c98" font-family="JetBrains Mono, monospace">→ CREDIT.mint(alice, share)</text>
  </g>

  <!-- LPs -->
  <g transform="translate(450,640)" filter="url(#softShadow)">
    <rect x="0" y="0" width="320" height="150" rx="18" fill="#12121c" stroke="#4ff1ff" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="20" fill="#4ff1ff"/>
    <text x="36" y="42" font-size="14" font-weight="700" fill="#07070b" text-anchor="middle">BO</text>
    <text x="70" y="34" font-size="18" font-weight="700" fill="#f4f4fb">LPs · 25%</text>
    <text x="70" y="54" font-size="13" fill="#b8b8cf">Bob stakes V3 NFT in gauge</text>
    <text x="20" y="92" font-size="13" fill="#b8b8cf">Push to LiquidityGauge</text>
    <text x="20" y="115" font-size="12" fill="#7c7c98">Vesting 14d after unstake</text>
    <text x="20" y="135" font-size="11" fill="#7c7c98" font-family="JetBrains Mono, monospace">→ harvest() linear vest</text>
  </g>

  <!-- Apps -->
  <g transform="translate(800,640)" filter="url(#softShadow)">
    <rect x="0" y="0" width="320" height="150" rx="18" fill="#12121c" stroke="#a6ff5f" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="20" fill="#a6ff5f"/>
    <text x="36" y="42" font-size="14" font-weight="700" fill="#07070b" text-anchor="middle">AP</text>
    <text x="70" y="34" font-size="18" font-weight="700" fill="#f4f4fb">Apps · 15%</text>
    <text x="70" y="54" font-size="13" fill="#b8b8cf">+ direct 5% rebate per pay</text>
    <text x="20" y="92" font-size="13" fill="#b8b8cf">Push to ownerRecipient</text>
    <text x="20" y="115" font-size="12" fill="#7c7c98">Proportional to project burn</text>
    <text x="20" y="135" font-size="11" fill="#7c7c98" font-family="JetBrains Mono, monospace">10k GOV collateral · 30d probation</text>
  </g>

  <!-- Treasury / POL -->
  <g transform="translate(1150,640)" filter="url(#softShadow)">
    <rect x="0" y="0" width="370" height="150" rx="18" fill="#12121c" stroke="#ffc53d" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="20" fill="#ffc53d"/>
    <text x="36" y="42" font-size="16" fill="#07070b" text-anchor="middle">⚙</text>
    <text x="70" y="34" font-size="18" font-weight="700" fill="#f4f4fb">Treasury POL · 5%</text>
    <text x="70" y="54" font-size="13" fill="#b8b8cf">Earmarked refill of liquidity</text>
    <text x="20" y="92" font-size="13" fill="#b8b8cf">addPOLFromRefill → V3 position NFT</text>
    <text x="20" y="115" font-size="12" fill="#7c7c98">FFP buyback if spot &lt; floor (24h)</text>
    <text x="20" y="135" font-size="11" fill="#7c7c98" font-family="JetBrains Mono, monospace">caps 20%/event · 30%/month</text>
  </g>

  <!-- Step 5 → recipients arrows -->
  <g fill="none" stroke-width="2">
    <path d="M1380 530 Q1380 580 250 580 Q250 620 250 640" stroke="#9f6bff" marker-end="url(#arrViolet)"/>
    <path d="M1390 530 Q1390 595 610 595 Q610 625 610 640" stroke="#4ff1ff" marker-end="url(#arrCyan)"/>
    <path d="M1400 530 Q1400 605 960 605 Q960 630 960 640" stroke="#a6ff5f" marker-end="url(#arrLime)"/>
    <path d="M1410 530 Q1410 615 1335 615 Q1335 635 1335 640" stroke="#ffc53d" marker-end="url(#arrWarn)"/>
  </g>

  <!-- =================== STEP 7 LOOP BACK =================== -->
  <g transform="translate(80,830)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#7c7c98" letter-spacing="2">7 · LOOP</text>
  </g>

  <g transform="translate(80,860)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1440" height="100" rx="18" fill="#12121c" stroke="url(#gradAccent)" stroke-width="1.5"/>
    <text x="30" y="40" font-size="18" font-weight="700" fill="#f4f4fb">Deflationary loop</text>
    <text x="30" y="68" font-size="13" fill="#b8b8cf">
      Stakers/LPs/Apps sell or hold CREDIT → secondary demand on DEX · Treasury refills POL → tighter spreads → Charlie buys cheaper → next round.
    </text>
    <text x="30" y="88" font-size="12" fill="#7c7c98" font-family="JetBrains Mono, monospace">
      α &lt; 1 + steady use ⇒ supply trends down · simulated -3.8% over 52 rounds (base scenario)
    </text>

    <!-- DAO badge -->
    <g transform="translate(1140,30)">
      <rect x="0" y="0" width="280" height="50" rx="14" fill="#0b0b12" stroke="#23233a"/>
      <circle cx="22" cy="25" r="10" fill="#ffc53d"/>
      <text x="22" y="30" font-size="11" font-weight="700" fill="#07070b" text-anchor="middle">DA</text>
      <text x="42" y="22" font-size="13" font-weight="700" fill="#f4f4fb">DAO Governance</text>
      <text x="42" y="40" font-size="11" fill="#7c7c98" font-family="JetBrains Mono, monospace">Governor + Timelock 2d · ~10d cycle</text>
    </g>
  </g>

  <!-- Big loop arrow back from Treasury to Step 1 -->
  <g fill="none" stroke="#ffc53d" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85">
    <path d="M1335 790 Q1335 820 1335 830 Q1335 855 1300 855 L 200 855 Q 170 855 170 830 L 170 540" marker-end="url(#arrWarn)"/>
  </g>
  <text x="700" y="848" font-size="12" fill="#ffc53d" font-family="JetBrains Mono, monospace" opacity="0.95">
    POL refill → deeper liquidity → cycle repeats
  </text>

  <!-- =================== ACTOR FLOW HINTS (top connectors) =================== -->
  <!-- Charlie connector to step 1 -->
  <g transform="translate(190,295)">
    <rect x="-50" y="0" width="100" height="36" rx="18" fill="#0b0b12" stroke="#ff6bd6"/>
    <circle cx="-30" cy="18" r="10" fill="#ff6bd6"/>
    <text x="-30" y="22" font-size="10" font-weight="700" fill="#07070b" text-anchor="middle">CH</text>
    <text x="0" y="22" font-size="13" fill="#f4f4fb">Charlie</text>
  </g>
  <line x1="190" y1="331" x2="190" y2="358" stroke="#ff6bd6" stroke-width="2" marker-end="url(#arrPink)"/>

  <!-- Footer brand line -->
  <g transform="translate(80,975)">
    <text x="0" y="0" font-size="11" fill="#5a5a74" font-family="JetBrains Mono, monospace">
      contracts: GOV · CREDIT · Staking · BurnTracker · FeeRouter · RewardDistributorV2 · LiquidityGauge · Treasury · ProjectRegistry · Governor · Timelock
    </text>
    <text x="1440" y="0" font-size="11" fill="#5a5a74" text-anchor="end" font-family="JetBrains Mono, monospace">
      web3community.xyz
    </text>
  </g>
</svg>
